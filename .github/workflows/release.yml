name: Release

on:
    push:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: read
        outputs:
            version: ${{ steps.version.outputs.version }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Get version source (PR title or commit message)
              id: source
              env:
                  COMMIT_MSG: ${{ github.event.head_commit.message }}
              run: ./scripts/release/get-version-source.sh

            - name: Parse version
              id: version
              env:
                  COMMIT_MSG: ${{ steps.source.outputs.text }}
              run: ./scripts/release/parse-version.sh

            - name: Update package.json
              if: steps.version.outputs.version != ''
              env:
                  VERSION: ${{ steps.version.outputs.version }}
              run: ./scripts/release/update-version.sh

            - name: Commit and push version bump
              if: steps.version.outputs.version != ''
              env:
                  VERSION: ${{ steps.version.outputs.version }}
              run: ./scripts/release/version-bump.sh

            - name: Setup Go
              if: steps.version.outputs.version != ''
              uses: actions/setup-go@v5
              with:
                  go-version-file: apps/miso/go.mod

            - name: Build binaries for all platforms
              if: steps.version.outputs.version != ''
              run: ./scripts/release/build-release.sh

            - name: Create release archives
              if: steps.version.outputs.version != ''
              env:
                  VERSION: ${{ steps.version.outputs.version }}
              run: ./scripts/release/create-archives.sh

            - name: Tag and push latest
              if: steps.version.outputs.version != ''
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git tag -f latest
                  git push origin latest --force

            - name: Create GitHub Release
              if: steps.version.outputs.version != ''
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: v${{ steps.version.outputs.version }}
                  name: Release v${{ steps.version.outputs.version }}
                  body: ${{ steps.source.outputs.text }}
                  files: |
                      dist/miso_${{ steps.version.outputs.version }}_darwin_amd64.tar.gz
                      dist/miso_${{ steps.version.outputs.version }}_darwin_arm64.tar.gz
                      dist/miso_${{ steps.version.outputs.version }}_linux_amd64.tar.gz
                      dist/miso_${{ steps.version.outputs.version }}_linux_arm64.tar.gz
                      dist/miso_${{ steps.version.outputs.version }}_windows_amd64.zip
                      dist/misox_${{ steps.version.outputs.version }}_darwin_amd64.tar.gz
                      dist/misox_${{ steps.version.outputs.version }}_darwin_arm64.tar.gz
                      dist/misox_${{ steps.version.outputs.version }}_linux_amd64.tar.gz
                      dist/misox_${{ steps.version.outputs.version }}_linux_arm64.tar.gz
                      dist/misox_${{ steps.version.outputs.version }}_windows_amd64.zip

    publish:
        needs: build
        if: needs.build.outputs.version != ''
        runs-on: ubuntu-latest
        permissions:
            id-token: write # needed for OIDC / trusted publishing
            contents: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Go
              uses: actions/setup-go@v5
              with:
                  go-version-file: apps/miso/go.mod

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: 22
                  registry-url: "https://registry.npmjs.org"

            # Ensure npm 11.5.1 or later for trusted publishing
            # See: https://docs.npmjs.com/trusted-publishers
            - name: Update npm to latest
              run: npm install -g npm@latest

            - name: Show Node & npm versions
              run: |
                  node -v
                  npm -v

            - name: Build Go binaries
              run: ./scripts/release/build-npm.sh

            - name: Check package info and authentication
              env:
                  VERSION: ${{ needs.build.outputs.version }}
              run: ./scripts/release/check-package-info.sh

            - name: Verify files before publish
              run: ./scripts/release/verify.sh

            # Trusted publishing via OIDC
            # Provenance is automatically generated when using trusted publishing
            # Make sure you've configured the trusted publisher on npmjs.com first:
            # https://www.npmjs.com/settings/[your-username]/packages -> [package-name] -> Settings -> Trusted Publishers
            # Workflow filename must match exactly: release.yml (case-sensitive)
            - name: Publish to npm
              working-directory: dist
              run: npm publish --access public --verbose
