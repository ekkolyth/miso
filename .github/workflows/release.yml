name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Read version from release.json
        id: version
        run: |
          VERSION=$(go run ./.github/release/version)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Build binaries for all platforms
        run: |
          mkdir -p dist
          GOOS=darwin GOARCH=amd64 go build -o dist/miso-darwin-amd64 ./cmd
          GOOS=darwin GOARCH=arm64 go build -o dist/miso-darwin-arm64 ./cmd
          GOOS=linux GOARCH=amd64 go build -o dist/miso-linux-amd64 ./cmd
          GOOS=linux GOARCH=arm64 go build -o dist/miso-linux-arm64 ./cmd
          GOOS=windows GOARCH=amd64 go build -o dist/miso-windows-amd64.exe ./cmd

      - name: Create release archives
        run: |
          cd dist
          tar -czf miso_${{ steps.version.outputs.version }}_darwin_amd64.tar.gz miso-darwin-amd64
          tar -czf miso_${{ steps.version.outputs.version }}_darwin_arm64.tar.gz miso-darwin-arm64
          tar -czf miso_${{ steps.version.outputs.version }}_linux_amd64.tar.gz miso-linux-amd64
          tar -czf miso_${{ steps.version.outputs.version }}_linux_arm64.tar.gz miso-linux-arm64
          zip miso_${{ steps.version.outputs.version }}_windows_amd64.zip miso-windows-amd64.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          files: |
            dist/miso_${{ steps.version.outputs.version }}_darwin_amd64.tar.gz
            dist/miso_${{ steps.version.outputs.version }}_darwin_arm64.tar.gz
            dist/miso_${{ steps.version.outputs.version }}_linux_amd64.tar.gz
            dist/miso_${{ steps.version.outputs.version }}_linux_arm64.tar.gz
            dist/miso_${{ steps.version.outputs.version }}_windows_amd64.zip

  publish-npm:
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org/'

      - name: Read version from release.json
        id: version
        run: |
          VERSION=$(go run ./.github/release/version)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Ensure bin directory exists (empty) for go-npm
        run: |
          mkdir -p bin
          # Ensure bin/ exists but is empty - go-npm will download the binary during install

      - name: Generate package.json from release.json
        run: |
          node -e "const fs=require('fs'); const rel=JSON.parse(fs.readFileSync('.github/release/release.json','utf8')); const pkg=JSON.parse(fs.readFileSync('.github/release/package.json','utf8')); pkg.version=rel.version; fs.writeFileSync('package.json', JSON.stringify(pkg,null,2));"

      - name: Check package info
        run: |
          echo "Package name: $(node -p "require('./package.json').name")"
          echo "Package version: $(node -p "require('./package.json').version")"
          echo "Checking if version exists on npm..."
          npm view $(node -p "require('./package.json').name")@$(node -p "require('./package.json').version") version || echo "No existing version match - Publishing"

      - name: Publish to npm
        run: npm publish --verbose
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

