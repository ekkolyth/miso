name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(go run ./.github/release/version)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Get tag message for release name
        id: tag_message
        run: |
          # Fetch tags from origin to ensure we have the latest tag
          git fetch origin --tags
          # Get the tag message from the annotated tag
          TAG_NAME="v${{ steps.version.outputs.version }}"
          # Extract the message line from the tag object (after the blank line)
          TAG_MESSAGE=$(git cat-file tag "$TAG_NAME" 2>/dev/null | sed -n '/^$/,$p' | sed '1d' | head -n 1 | xargs)
          # Fallback to default if tag message is empty
          if [ -z "$TAG_MESSAGE" ]; then
            TAG_MESSAGE="Release v${{ steps.version.outputs.version }}"
          fi
          echo "tag_message=$TAG_MESSAGE" >> $GITHUB_OUTPUT
          echo "Tag message: $TAG_MESSAGE"

      - name: Build binaries for all platforms
        run: |
          make build-all
          mkdir -p dist
          cp bin/miso-* dist/

      - name: Create release archives
        run: |
          cd dist
          tar -czf miso_${{ steps.version.outputs.version }}_darwin_amd64.tar.gz miso-darwin-amd64
          tar -czf miso_${{ steps.version.outputs.version }}_darwin_arm64.tar.gz miso-darwin-arm64
          tar -czf miso_${{ steps.version.outputs.version }}_linux_amd64.tar.gz miso-linux-amd64
          tar -czf miso_${{ steps.version.outputs.version }}_linux_arm64.tar.gz miso-linux-arm64
          zip miso_${{ steps.version.outputs.version }}_windows_amd64.zip miso-windows-amd64.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: ${{ steps.tag_message.outputs.tag_message }}
          files: |
            dist/miso_${{ steps.version.outputs.version }}_darwin_amd64.tar.gz
            dist/miso_${{ steps.version.outputs.version }}_darwin_arm64.tar.gz
            dist/miso_${{ steps.version.outputs.version }}_linux_amd64.tar.gz
            dist/miso_${{ steps.version.outputs.version }}_linux_arm64.tar.gz
            dist/miso_${{ steps.version.outputs.version }}_windows_amd64.zip

  publish-npm:
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      id-token: write # needed for OIDC / trusted publishing
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      # Ensure npm 11.5.1 or later for trusted publishing
      # See: https://docs.npmjs.com/trusted-publishers
      - name: Update npm to latest
        run: npm install -g npm@latest

      - name: Show Node & npm versions
        run: |
          node -v
          npm -v

      - name: Build Go binaries
        run: |
          mkdir -p dist
          GOOS=darwin GOARCH=amd64 go build -o dist/miso-darwin-amd64 ./cmd
          GOOS=darwin GOARCH=arm64 go build -o dist/miso-darwin-arm64 ./cmd
          GOOS=linux GOARCH=amd64 go build -o dist/miso-linux-amd64 ./cmd
          GOOS=linux GOARCH=arm64 go build -o dist/miso-linux-arm64 ./cmd

      - name: Copy package.json to dist
        run: cp package.json dist/package.json

      - name: Copy cli.mjs to dist
        run: cp cli.mjs dist/cli.mjs

      - name: Copy README.md to dist
        run: cp README.md dist/README.md

      - name: Check package info and authentication
        working-directory: dist
        env:
          VERSION: ${{ needs.build-and-release.outputs.version }}
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$VERSION
          echo "Package name: $PACKAGE_NAME"
          echo "Package version: $PACKAGE_VERSION"
          echo "Checking npm registry..."
          npm config get registry
          echo "Checking if package exists on npm..."
          if npm view "$PACKAGE_NAME" version 2>/dev/null; then
            echo "Package exists on npm"
            echo "Checking if version $PACKAGE_VERSION already exists..."
            npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version 2>/dev/null && echo "Version $PACKAGE_VERSION already published" || echo "Version $PACKAGE_VERSION not found - will publish"
          else
            echo "Package does not exist on npm - first time publish"
          fi

      # Trusted publishing via OIDC
      # Provenance is automatically generated when using trusted publishing
      # Make sure you've configured the trusted publisher on npmjs.com first:
      # https://www.npmjs.com/settings/[your-username]/packages -> [package-name] -> Settings -> Trusted Publishers
      # Workflow filename must match exactly: release.yml (case-sensitive)
      - name: Publish to npm (trusted publishing via OIDC)
        working-directory: dist
        run: npm publish --access public --verbose
