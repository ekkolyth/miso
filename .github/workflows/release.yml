name: Release

on:
    push:
        branches: [main]

jobs:
    version:
        runs-on: ubuntu-latest
        if: "!contains(github.event.head_commit.message, '[skip ci]')"
        outputs:
            version: ${{ steps.version.outputs.version }}
            notes: ${{ steps.version.outputs.notes }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  token: ${{ secrets.RELEASE_TOKEN }}
                  fetch-depth: 0

            - name: Resolve version from PR label
              id: version
              env:
                  GITHUB_SHA: ${{ github.sha }}
                  GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
              run: ./scripts/release/version/resolve.sh

    build:
        needs: version
        if: needs.version.outputs.version != ''
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  token: ${{ secrets.RELEASE_TOKEN }}

            - name: Update package.json version
              env:
                  VERSION: ${{ needs.version.outputs.version }}
              run: ./scripts/release/version/update.sh

            - name: Commit and push version bump
              env:
                  VERSION: ${{ needs.version.outputs.version }}
              run: ./scripts/release/version/commit.sh

            - name: Setup Go
              uses: actions/setup-go@v6
              with:
                  go-version-file: apps/miso/go.mod

            - name: Test
              run: cd apps/miso && go test -race ./...

            - name: Lint
              uses: golangci/golangci-lint-action@v9
              with:
                  version: latest
                  working-directory: apps/miso

            - name: Build binaries for all platforms
              run: ./scripts/release/build/npm.sh

            - name: Upload npm dist artifact
              uses: actions/upload-artifact@v7
              with:
                  name: npm-dist
                  path: dist/
                  retention-days: 1

    release:
        needs: [version, build]
        if: needs.version.outputs.version != ''
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  ref: main
                  token: ${{ secrets.RELEASE_TOKEN }}

            - name: Download npm dist artifact
              uses: actions/download-artifact@v8
              with:
                  name: npm-dist
                  path: dist

            - name: Create release archives
              env:
                  VERSION: ${{ needs.version.outputs.version }}
              run: ./scripts/release/create-archives.sh

            - name: Upload checksums artifact
              uses: actions/upload-artifact@v7
              with:
                  name: checksums
                  path: dist/checksums.txt
                  retention-days: 1

            - name: Tag and push latest
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git tag -f latest
                  git push origin latest --force

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: v${{ needs.version.outputs.version }}
                  name: Release v${{ needs.version.outputs.version }}
                  body: ${{ needs.version.outputs.notes }}
                  files: |
                      dist/miso_${{ needs.version.outputs.version }}_darwin_amd64.tar.gz
                      dist/miso_${{ needs.version.outputs.version }}_darwin_arm64.tar.gz
                      dist/miso_${{ needs.version.outputs.version }}_linux_amd64.tar.gz
                      dist/miso_${{ needs.version.outputs.version }}_linux_arm64.tar.gz
                      dist/miso_${{ needs.version.outputs.version }}_windows_amd64.zip
                      dist/misox_${{ needs.version.outputs.version }}_darwin_amd64.tar.gz
                      dist/misox_${{ needs.version.outputs.version }}_darwin_arm64.tar.gz
                      dist/misox_${{ needs.version.outputs.version }}_linux_amd64.tar.gz
                      dist/misox_${{ needs.version.outputs.version }}_linux_arm64.tar.gz
                      dist/misox_${{ needs.version.outputs.version }}_windows_amd64.zip
                      dist/checksums.txt

    homebrew:
        needs: [version, release]
        if: needs.version.outputs.version != ''
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Download checksums artifact
              uses: actions/download-artifact@v8
              with:
                  name: checksums
                  path: dist

            - name: Fail if tap token missing
              env:
                  HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
              run: |
                  if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
                    echo "::error::HOMEBREW_TAP_TOKEN not set — cannot push formula" >&2
                    exit 1
                  fi

            - name: Render formula
              env:
                  VERSION: ${{ needs.version.outputs.version }}
              run: ./scripts/release/homebrew/render.sh > /tmp/miso.rb

            - name: Push to tap
              env:
                  HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
                  VERSION: ${{ needs.version.outputs.version }}
              run: |
                  git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/dvflw/homebrew-tap.git" tap
                  cp /tmp/miso.rb tap/Formula/miso.rb
                  cd tap
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add Formula/miso.rb
                  git commit -m "miso $VERSION"
                  git push

    publish:
        needs: [version, release]
        if: needs.version.outputs.version != ''
        runs-on: ubuntu-latest
        permissions:
            id-token: write # needed for OIDC / trusted publishing
            contents: read
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  ref: main
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download npm dist artifact
              uses: actions/download-artifact@v8
              with:
                  name: npm-dist
                  path: dist

            - name: Restore binary permissions
              run: chmod +x dist/bin/miso-* dist/bin/misox-* && chmod -x dist/bin/*.exe

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 22
                  registry-url: "https://registry.npmjs.org"

            # Ensure npm 11.5.1 or later for trusted publishing
            # See: https://docs.npmjs.com/trusted-publishers
            - name: Update npm to latest
              run: npm install -g npm@latest

            - name: Show Node & npm versions
              run: |
                  node -v
                  npm -v

            - name: Check package info and authentication
              env:
                  VERSION: ${{ needs.version.outputs.version }}
              run: ./scripts/release/check-package-info.sh

            - name: Verify files before publish
              run: ./scripts/release/verify.sh

            # Trusted publishing via OIDC
            # Provenance is automatically generated when using trusted publishing
            # Make sure you've configured the trusted publisher on npmjs.com first:
            # https://www.npmjs.com/settings/[your-username]/packages -> [package-name] -> Settings -> Trusted Publishers
            # Workflow filename must match exactly: release.yml (case-sensitive)
            - name: Publish to npm
              working-directory: dist
              run: npm publish --access public --verbose
