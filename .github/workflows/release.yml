name: Release

on:
    push:
        tags:
            - "v*"

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        outputs:
            version: ${{ steps.version.outputs.version }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Setup Go
              uses: actions/setup-go@v5
              with:
                  go-version-file: apps/miso/go.mod

            - name: Build version tool
              run: |
                  cd apps/miso && go build -o ../../.github/release/version/version ../../.github/release/version/main.go

            - name: Read version from package.json
              id: version
              run: |
                  VERSION=$(./.github/release/version/version)
                  echo "version=$VERSION" >> $GITHUB_OUTPUT
                  echo "Version: $VERSION"

            - name: Get tag message for release name
              id: tag_message
              run: |
                  TAG_MESSAGE=$(git tag -l --format='%(contents:subject)' v${{ steps.version.outputs.version }})
                  echo "tag_message=$TAG_MESSAGE" >> $GITHUB_OUTPUT
                  echo "Tag message: $TAG_MESSAGE"

            - name: Build binaries for all platforms
              run: |
                  make build-all
                  mkdir -p dist
                  cp apps/miso/bin/miso-* dist/
                  cp apps/miso/bin/misox-* dist/
                  cp apps/miso/miso.mjs apps/miso/misox.mjs dist/

            - name: Create release archives
              run: |
                  cd dist
                  tar -czf miso_${{ steps.version.outputs.version }}_darwin_amd64.tar.gz miso-darwin-amd64
                  tar -czf miso_${{ steps.version.outputs.version }}_darwin_arm64.tar.gz miso-darwin-arm64
                  tar -czf miso_${{ steps.version.outputs.version }}_linux_amd64.tar.gz miso-linux-amd64
                  tar -czf miso_${{ steps.version.outputs.version }}_linux_arm64.tar.gz miso-linux-arm64
                  zip miso_${{ steps.version.outputs.version }}_windows_amd64.zip miso-windows-amd64.exe
                  tar -czf misox_${{ steps.version.outputs.version }}_darwin_amd64.tar.gz misox-darwin-amd64
                  tar -czf misox_${{ steps.version.outputs.version }}_darwin_arm64.tar.gz misox-darwin-arm64
                  tar -czf misox_${{ steps.version.outputs.version }}_linux_amd64.tar.gz misox-linux-amd64
                  tar -czf misox_${{ steps.version.outputs.version }}_linux_arm64.tar.gz misox-linux-arm64
                  zip misox_${{ steps.version.outputs.version }}_windows_amd64.zip misox-windows-amd64.exe

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v1
              with:
                  tag_name: v${{ steps.version.outputs.version }}
                  name: Release v${{ steps.version.outputs.version }}
                  files: |
                      dist/miso_${{ steps.version.outputs.version }}_darwin_amd64.tar.gz
                      dist/miso_${{ steps.version.outputs.version }}_darwin_arm64.tar.gz
                      dist/miso_${{ steps.version.outputs.version }}_linux_amd64.tar.gz
                      dist/miso_${{ steps.version.outputs.version }}_linux_arm64.tar.gz
                      dist/miso_${{ steps.version.outputs.version }}_windows_amd64.zip
                      dist/misox_${{ steps.version.outputs.version }}_darwin_amd64.tar.gz
                      dist/misox_${{ steps.version.outputs.version }}_darwin_arm64.tar.gz
                      dist/misox_${{ steps.version.outputs.version }}_linux_amd64.tar.gz
                      dist/misox_${{ steps.version.outputs.version }}_linux_arm64.tar.gz
                      dist/misox_${{ steps.version.outputs.version }}_windows_amd64.zip

    publish:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            id-token: write # needed for OIDC / trusted publishing
            contents: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Go
              uses: actions/setup-go@v5
              with:
                  go-version-file: apps/miso/go.mod

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: 22
                  registry-url: "https://registry.npmjs.org"

            # Ensure npm 11.5.1 or later for trusted publishing
            # See: https://docs.npmjs.com/trusted-publishers
            - name: Update npm to latest
              run: npm install -g npm@latest

            - name: Show Node & npm versions
              run: |
                  node -v
                  npm -v

            - name: Build Go binaries
              run: |
                  mkdir -p dist/bin
                  cd apps/miso
                  GOOS=darwin GOARCH=amd64 go build -o ../../dist/bin/miso-darwin-amd64 ./cmd
                  GOOS=darwin GOARCH=arm64 go build -o ../../dist/bin/miso-darwin-arm64 ./cmd
                  GOOS=linux GOARCH=amd64 go build -o ../../dist/bin/miso-linux-amd64 ./cmd
                  GOOS=linux GOARCH=arm64 go build -o ../../dist/bin/miso-linux-arm64 ./cmd
                  GOOS=windows GOARCH=amd64 go build -o ../../dist/bin/miso-windows-amd64.exe ./cmd
                  GOOS=darwin GOARCH=amd64 go build -o ../../dist/bin/misox-darwin-amd64 ./cmd
                  GOOS=darwin GOARCH=arm64 go build -o ../../dist/bin/misox-darwin-arm64 ./cmd
                  GOOS=linux GOARCH=amd64 go build -o ../../dist/bin/misox-linux-amd64 ./cmd
                  GOOS=linux GOARCH=arm64 go build -o ../../dist/bin/misox-linux-arm64 ./cmd
                  GOOS=windows GOARCH=amd64 go build -o ../../dist/bin/misox-windows-amd64.exe ./cmd
                  cd ../..
                  cp apps/miso/miso.mjs apps/miso/misox.mjs apps/miso/package.json README.md dist/

            - name: Check package info and authentication
              working-directory: dist
              env:
                  VERSION: ${{ needs.build.outputs.version }}
              run: |
                  PACKAGE_NAME=$(node -p "require('./package.json').name")
                  PACKAGE_VERSION=$VERSION
                  echo "Package name: $PACKAGE_NAME"
                  echo "Package version: $PACKAGE_VERSION"
                  echo "Checking npm registry..."
                  npm config get registry
                  echo "Checking if package exists on npm..."
                  if npm view "$PACKAGE_NAME" version 2>/dev/null; then
                    echo "Package exists on npm"
                    echo "Checking if version $PACKAGE_VERSION already exists..."
                    npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version 2>/dev/null && echo "Version $PACKAGE_VERSION already published" || echo "Version $PACKAGE_VERSION not found - will publish"
                  else
                    echo "Package does not exist on npm - first time publish"
                  fi

            - name: Verify files before publish
              working-directory: dist
              run: |
                  echo "Verifying required files exist in dist/..."
                  echo "Files in dist/:"
                  ls -la
                  echo ""
                  echo "Checking required files:"
                  if [ ! -f "README.md" ]; then
                    echo "ERROR: README.md is missing!"
                    exit 1
                  fi
                  echo "✓ README.md exists"
                  if [ ! -f "miso.mjs" ]; then
                    echo "ERROR: miso.mjs is missing!"
                    exit 1
                  fi
                  echo "✓ miso.mjs exists"
                  if [ ! -f "misox.mjs" ]; then
                    echo "ERROR: misox.mjs is missing!"
                    exit 1
                  fi
                  echo "✓ misox.mjs exists"
                  if [ ! -f "package.json" ]; then
                    echo "ERROR: package.json is missing!"
                    exit 1
                  fi
                  echo "✓ package.json exists"
                  echo ""
                  echo "Checking bin paths in package.json:"
                  BIN_MISO=$(node -p "require('./package.json').bin.miso")
                  BIN_MISOX=$(node -p "require('./package.json').bin.misox")
                  echo "bin.miso: $BIN_MISO"
                  echo "bin.misox: $BIN_MISOX"
                  if [ ! -f "$BIN_MISO" ]; then
                    echo "ERROR: Bin file $BIN_MISO does not exist!"
                    exit 1
                  fi
                  echo "✓ $BIN_MISO exists"
                  if [ ! -f "$BIN_MISOX" ]; then
                    echo "ERROR: Bin file $BIN_MISOX does not exist!"
                    exit 1
                  fi
                  echo "✓ $BIN_MISOX exists"
                  echo ""
                  echo "All files verified successfully!"

            # Trusted publishing via OIDC
            # Provenance is automatically generated when using trusted publishing
            # Make sure you've configured the trusted publisher on npmjs.com first:
            # https://www.npmjs.com/settings/[your-username]/packages -> [package-name] -> Settings -> Trusted Publishers
            # Workflow filename must match exactly: release.yml (case-sensitive)
            - name: Publish to npm (trusted publishing via OIDC)
              working-directory: dist
              run: npm publish --access public --verbose
